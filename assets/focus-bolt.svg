<svg xmlns="http://www.w3.org/2000/svg" width="270" height="250" viewBox="0 0 270 250" role="img"><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}:root{--surface:#ffffff;--border:#d0d7de;--text:#0f172a;--muted:#57606a;--accent:#1d4ed8;--accent2:#0284c7;--chip:#eff6ff;--chipb:#bfdbfe;--chipt:#1e40af}@media (prefers-color-scheme:dark){:root{--surface:#0f172a;--border:#24324d;--text:#e6edf3;--muted:#9da7b3;--accent:#60a5fa;--accent2:#38bdf8;--chip:#13254a;--chipb:#1e3a8a;--chipt:#bfdbfe}}.surface{fill:var(--surface);stroke:var(--border)}.t{fill:var(--text)}.mu{fill:var(--muted)}.ac{fill:var(--accent)}.chip{fill:var(--chip);stroke:var(--chipb)}.chipt{fill:var(--chipt)}.g1{stop-color:var(--accent)}.g2{stop-color:var(--accent2)}.rule{stroke:var(--border)}</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="g1"/><stop offset="1" class="g2"/></linearGradient></defs><rect x="0.5" y="0.5" width="269" height="249" rx="14" class="surface"/><rect x="22" y="22" width="44" height="44" rx="12" class="chip"/><g transform="translate(22,22)"><path d="M24.5 8 L12.5 24 H20.5 L18.5 36 L31.5 19.5 H23 Z" class="ac"/></g><text x="22" y="96" class="s t" font-size="15" font-weight="700" text-anchor="start">Performance and</text><text x="22" y="117" class="s t" font-size="15" font-weight="700" text-anchor="start">correctness</text><text x="22" y="148" class="s mu" font-size="12.5" font-weight="400" text-anchor="start">Data modeling, query performance,</text><text x="22" y="167" class="s mu" font-size="12.5" font-weight="400" text-anchor="start">and concurrency: N+1 queries,</text><text x="22" y="186" class="s mu" font-size="12.5" font-weight="400" text-anchor="start">inefficient ORM usage, and</text><text x="22" y="205" class="s mu" font-size="12.5" font-weight="400" text-anchor="start">configuration handling that stays</text><text x="22" y="224" class="s mu" font-size="12.5" font-weight="400" text-anchor="start">safe under concurrent access.</text></svg>
