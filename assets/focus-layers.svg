<svg xmlns="http://www.w3.org/2000/svg" width="270" height="250" viewBox="0 0 270 250" role="img"><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}:root{--surface:#ffffff;--border:#d0d7de;--text:#0f172a;--muted:#57606a;--accent:#1d4ed8;--accent2:#0284c7;--chip:#eff6ff;--chipb:#bfdbfe;--chipt:#1e40af}@media (prefers-color-scheme:dark){:root{--surface:#0f172a;--border:#24324d;--text:#e6edf3;--muted:#9da7b3;--accent:#60a5fa;--accent2:#38bdf8;--chip:#13254a;--chipb:#1e3a8a;--chipt:#bfdbfe}}.surface{fill:var(--surface);stroke:var(--border)}.t{fill:var(--text)}.mu{fill:var(--muted)}.ac{fill:var(--accent)}.chip{fill:var(--chip);stroke:var(--chipb)}.chipt{fill:var(--chipt)}.g1{stop-color:var(--accent)}.g2{stop-color:var(--accent2)}.rule{stroke:var(--border)}</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="g1"/><stop offset="1" class="g2"/></linearGradient></defs><rect x="0.5" y="0.5" width="269" height="249" rx="14" class="surface"/><rect x="22" y="22" width="44" height="44" rx="12" class="chip"/><g transform="translate(22,22)"><rect x="11" y="11" width="22" height="5" rx="2.5" class="ac"/><rect x="11" y="19.5" width="22" height="5" rx="2.5" class="ac" fill-opacity="0.7"/><rect x="11" y="28" width="22" height="5" rx="2.5" class="ac" fill-opacity="0.4"/></g><text x="22" y="96" class="s t" font-size="15" font-weight="700" text-anchor="start">Document ingestion and</text><text x="22" y="117" class="s t" font-size="15" font-weight="700" text-anchor="start">vector indexing</text><text x="22" y="148" class="s mu" font-size="12.5" font-weight="400" text-anchor="start">Multi-tenant pipelines at Techset</text><text x="22" y="167" class="s mu" font-size="12.5" font-weight="400" text-anchor="start">Solutions that process company</text><text x="22" y="186" class="s mu" font-size="12.5" font-weight="400" text-anchor="start">documents into searchable vector</text><text x="22" y="205" class="s mu" font-size="12.5" font-weight="400" text-anchor="start">indexes on PostgreSQL and</text><text x="22" y="224" class="s mu" font-size="12.5" font-weight="400" text-anchor="start">pgvector.</text></svg>
