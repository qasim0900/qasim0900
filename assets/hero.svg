xtLength="479.4" lengthAdjust="spacingAndGlyphs">backends for AI agent platforms and MCP servers</text><rect class="cur" x="567.4" y="349" width="10" height="19" fill="#38bdf8"/></g><g class="ph p3"><text x="82" y="364" class="m" font-size="17" font-weight="500" text-anchor="start" fill="#e2e8f0" textLength="387.6" lengthAdjust="spacingAndGlyphs">APIs that serve 100K+ requests per day</text><rect class="cur" x="475.6" y="349" width="10" height="19" fill="#38bdf8"/></g><rect x="700.5" y="98.5" width="443" height="278" rx="14" fill="#0b1220" fill-opacity="0.72" stroke="#334155"/><circle cx="728" cy="122" r="6.5" fill="#ff5f57"/><circle cx="749" cy="122" r="6.5" fill="#febc2e"/><circle cx="770" cy="122" r="6.5" fill="#28c840"/><path d="M701 145.5 H1143" stroke="#334155"/><text x="922" y="127" class="m" font-size="13" font-weight="500" text-anchor="middle" fill="#94a3b8">engineer.py</text><text x="728" y="178" class="m" font-size="15"><tspan fill="#c084fc">class </tspan><tspan fill="#fde68a">Engineer</tspan><tspan fill="#94a3b8">:</tspan></text><text x="764" y="203" class="m" font-size="15"><tspan fill="#e2e8f0">role</tspan><tspan fill="#94a3b8"> = </tspan><tspan fill="#86efac">"Senior Software Engineer"</tspan></text><text x="764" y="228" class="m" font-size="15"><tspan fill="#e2e8f0">stack</tspan><tspan fill="#94a3b8"> = [</tspan><tspan fill="#86efac">"Python"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#86efac">"Django"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#86efac">"FastAPI"</tspan><tspan fill="#94a3b8">]</tspan></text><text x="764" y="253" class="m" font-size="15"><tspan fill="#e2e8f0">focus</tspan><tspan fill="#94a3b8"> = [</tspan></text><text x="800" y="278" class="m" font-size="15"><tspan fill="#86efac">"AI/LLM backends"</tspan><tspan fill="#94a3b8">,</tspan></text><text x="800" y="303" class="m" font-size="15"><tspan fill="#86efac">"multi-tenant SaaS"</tspan><tspan fill="#94a3b8">,</tspan></text><text x="764" y="328" class="m" font-size="1