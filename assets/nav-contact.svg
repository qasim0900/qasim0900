<svg xmlns="http://www.w3.org/2000/svg" width="97" height="36" viewBox="0 0 97 36" role="img"><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}:root{--surface:#ffffff;--border:#d0d7de;--text:#0f172a;--muted:#57606a;--accent:#1d4ed8;--accent2:#0284c7;--chip:#eff6ff;--chipb:#bfdbfe;--chipt:#1e40af}@media (prefers-color-scheme:dark){:root{--surface:#0f172a;--border:#24324d;--text:#e6edf3;--muted:#9da7b3;--accent:#60a5fa;--accent2:#38bdf8;--chip:#13254a;--chipb:#1e3a8a;--chipt:#bfdbfe}}.surface{fill:var(--surface);stroke:var(--border)}.t{fill:var(--text)}.mu{fill:var(--muted)}.ac{fill:var(--accent)}.chip{fill:var(--chip);stroke:var(--chipb)}.chipt{fill:var(--chipt)}.g1{stop-color:var(--accent)}.g2{stop-color:var(--accent2)}.rule{stroke:var(--border)}</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="g1"/><stop offset="1" class="g2"/></linearGradient></defs><rect x="0.5" y="0.5" width="96" height="35" rx="17.5" class="surface"/><text x="48.5" y="23" class="s t" font-size="13" font-weight="600" text-anchor="middle">Contact</text></svg>
