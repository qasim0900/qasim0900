<svg xmlns="http://www.w3.org/2000/svg" width="410" height="225" viewBox="0 0 410 225" role="img"><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}:root{--surface:#ffffff;--border:#d0d7de;--text:#0f172a;--muted:#57606a;--accent:#1d4ed8;--accent2:#0284c7;--chip:#eff6ff;--chipb:#bfdbfe;--chipt:#1e40af}@media (prefers-color-scheme:dark){:root{--surface:#0f172a;--border:#24324d;--text:#e6edf3;--muted:#9da7b3;--accent:#60a5fa;--accent2:#38bdf8;--chip:#13254a;--chipb:#1e3a8a;--chipt:#bfdbfe}}.surface{fill:var(--surface);stroke:var(--border)}.t{fill:var(--text)}.mu{fill:var(--muted)}.ac{fill:var(--accent)}.chip{fill:var(--chip);stroke:var(--chipb)}.chipt{fill:var(--chipt)}.g1{stop-color:var(--accent)}.g2{stop-color:var(--accent2)}.rule{stroke:var(--border)}</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="g1"/><stop offset="1" class="g2"/></linearGradient></defs><rect x="0.5" y="0.5" width="409" height="224" rx="14" class="surface"/><rect x="22" y="22" width="143.4" height="24" rx="12" class="chip"/><text x="31" y="38" class="m chipt" font-size="11" font-weight="500" text-anchor="start" textLength="125.4" lengthAdjust="spacingAndGlyphs">Apr 2025 – Jun 2026</text><text x="22" y="78" class="s t" font-size="16" font-weight="700" text-anchor="start">Software Engineer</text><text x="22" y="101" class="s ac" font-size="13" font-weight="600" text-anchor="start">AAK Tele-Science, Inc.</text><text x="22" y="121" class="s mu" font-size="12" font-weight="400" text-anchor="start">United States (Remote)</text><path d="M22 137.5 H388" class="rule"/><text x="22" y="161" class="s t" font-size="12.5" font-weight="400" text-anchor="start">Django and FastAPI services on AWS, Redis caching,</text><text x="22" y="180" class="s t" font-size="12.5" font-weight="400" text-anchor="start">and LangChain and Open